name: Docs

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "segmenteverygrain/**.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # The heavy ML dependencies (tensorflow, torch, sam2) are mocked in
        # docs/source/conf.py via autodoc_mock_imports, so only the
        # lightweight dependencies are needed to build the docs.
        run: |
          python -m pip install --upgrade pip
          pip install sphinx
          pip install numpy matplotlib pandas scipy scikit-image scikit-learn \
            shapely networkx rasterio rtree pillow tqdm

      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
